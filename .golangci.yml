run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - gosimple
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
    - misspell
    - unconvert

linters-settings:
  govet:
    check-shadowing: true
  misspell:
    locale: US

issues:
  exclude-dirs:
    - vendor
  exclude-use-default: false
  max-issues-per-linter: 50
  max-same-issues: 3
