name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-ci:
    name: Backend (Go API)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
          cache-dependency-path: apps/api/go.sum

      - name: Verify Dependencies
        run: |
          cd apps/api
          go mod verify

      - name: Run Go Vet
        run: |
          cd apps/api
          go vet ./...

      - name: Run Unit Tests
        run: |
          cd apps/api
          go test -v -race ./...

  frontend-ci:
    name: Frontend (Next.js)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Install Dependencies
        run: |
          cd apps/web
          pnpm install --frozen-lockfile

      - name: Run Linter
        run: |
          cd apps/web
          pnpm run lint

      - name: Build Web Application
        run: |
          cd apps/web
          pnpm run build
