name: CI/CD Pipeline - SatSet Production

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. CI (Continuous Integration): Test & Build Verification
  # ============================================================================
  ci-check:
    name: Test & Build Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # --- Backend Checks ---
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'backend/go.mod'
          cache-dependency-path: 'backend/go.sum'

      - name: Run Backend Tests
        run: |
          cd backend
          go test -v ./...

      - name: Verify Backend Build
        run: |
          cd backend
          CGO_ENABLED=0 go build -v -ldflags="-w -s" -o /tmp/satset-api ./cmd/api

      # --- Frontend Checks ---
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run TypeScript Typecheck
        run: |
          cd frontend
          npm run typecheck

      - name: Verify Frontend Build
        run: |
          cd frontend
          npm run build

  # ============================================================================
  # 2. CD (Continuous Deployment): Auto Deploy to VPS via SSH
  # ============================================================================
  deploy-to-vps:
    name: Deploy to Production VPS
    needs: ci-check
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Execute Remote SSH Commands
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "🚀 [1/4] Navigating to SatSet project..."
            cd ~/apps/SatSet-App

            echo "📥 [2/4] Pulling latest updates from GitHub..."
            git pull origin main

            echo "🐳 [3/4] Rebuilding & updating production containers..."
            docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build

            echo "🧹 [4/4] Pruning dangling images & checking container health..."
            docker image prune -f
            docker compose -f docker-compose.prod.yml --env-file .env.production ps
